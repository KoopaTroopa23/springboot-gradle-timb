spring.application.name=springboot-gradle-timb
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Render and AWS inject PORT at runtime; fall back to 8080 locally
server.port=${PORT:8080}

# H2 in-memory datasource for Hibernate/JPA
spring.datasource.url=jdbc:h2:mem:timbdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
