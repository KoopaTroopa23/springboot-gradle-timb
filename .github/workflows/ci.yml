name: CI

on:
  push:
  pull_request:

jobs:

  # ──────────────────────────────────────────────────────────
  # Job 1: refresh deps, clean build, run all unit tests
  # ──────────────────────────────────────────────────────────
  test:
    name: Unit Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Refresh dependencies
        run: ./gradlew dependencies --refresh-dependencies

      - name: Clean build (compiles + runs all unit tests)
        run: ./gradlew clean build

      - name: Check (verify all tests and checks are green)
        run: ./gradlew check

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: |
            build/reports/tests/test/
            build/test-results/test/

  # ──────────────────────────────────────────────────────────
  # Job 2: start the app with bootRun and smoke-test endpoints
  # Only runs after the test job passes
  # ──────────────────────────────────────────────────────────
  smoke-test:
    name: Boot Run Smoke Test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Start application with bootRun (background)
        run: ./gradlew bootRun > bootrun.log 2>&1 &

      - name: Wait for application to start on port 8080
        run: |
          echo "Waiting for Spring Boot to start..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/ > /dev/null 2>&1; then
              echo "Application is up on attempt $i"
              exit 0
            fi
            echo "Attempt $i/30: not ready yet, sleeping 5s..."
            sleep 5
          done
          echo "Application did not start within 150s. Boot log:"
          cat bootrun.log
          exit 1

      - name: "Smoke: GET / returns Hello World"
        run: |
          RESPONSE=$(curl -s http://localhost:8080/)
          echo "GET / -> '$RESPONSE'"
          [ "$RESPONSE" = "Hello, World!" ] || { echo "FAIL: expected 'Hello, World!'"; exit 1; }

      - name: "Smoke: GET /api/ returns welcome message"
        run: |
          RESPONSE=$(curl -s http://localhost:8080/api/)
          echo "GET /api/ -> '$RESPONSE'"
          echo "$RESPONSE" | grep -qi "welcome" || { echo "FAIL: expected 'welcome' in response"; exit 1; }

      - name: "Smoke: POST /api/login with valid credentials returns 200"
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "http://localhost:8080/api/login?username=kw&password=bigT")
          BODY=$(echo "$RESPONSE" | head -1)
          STATUS=$(echo "$RESPONSE" | tail -1)
          echo "POST /api/login (valid) -> HTTP $STATUS | '$BODY'"
          [ "$STATUS" = "200" ] || { echo "FAIL: expected 200, got $STATUS"; exit 1; }
          echo "$BODY" | grep -qi "Access granted" || { echo "FAIL: expected 'Access granted' in body"; exit 1; }

      - name: "Smoke: POST /api/login with invalid credentials returns 401"
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "http://localhost:8080/api/login?username=hacker&password=wrong")
          echo "POST /api/login (invalid) -> HTTP $STATUS"
          [ "$STATUS" = "401" ] || { echo "FAIL: expected 401, got $STATUS"; exit 1; }

      - name: "Smoke: GET /api/profile returns 200"
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/profile)
          echo "GET /api/profile -> HTTP $STATUS"
          [ "$STATUS" = "200" ] || { echo "FAIL: expected 200, got $STATUS"; exit 1; }

      - name: Stop application
        if: always()
        run: |
          pkill -f 'SpringbootGradleTimbApplication' || true
          pkill -f 'bootRun' || true

      - name: Upload boot run log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bootrun-log
          path: bootrun.log
